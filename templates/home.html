<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Student Exam Performance Prediction</title>

<script src="https://cdn.tailwindcss.com"></script>
```

</head>

<body class="bg-slate-50 min-h-screen">

```
<div class="max-w-3xl mx-auto px-4 py-10">

    <!-- Main Card -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

        <!-- Header -->
        <div class="bg-sky-400 text-white text-center py-6">
            <h1 class="text-3xl font-bold">
                Student Exam Performance Prediction
            </h1>

            <p class="mt-2 text-sky-50">
                Predict your Maths score
            </p>
        </div>


        <!-- Form -->
        <div class="p-6 md:p-8">

            <form action="{{ url_for('predict_datapoint') }}" method="post">

                <!-- Gender -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">
                        Gender
                    </label>

                    <select
                        name="gender"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-sky-300
                               focus:border-sky-400">

                        <option value="" disabled
                            {% if not request.form.get('gender') %}selected{% endif %}>
                            Select your Gender
                        </option>

                        <option value="male"
                            {% if request.form.get('gender') == 'male' %}selected{% endif %}>
                            Male
                        </option>

                        <option value="female"
                            {% if request.form.get('gender') == 'female' %}selected{% endif %}>
                            Female
                        </option>

                    </select>
                </div>


                <!-- Ethnicity -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">
                        Race or Ethnicity
                    </label>

                    <select
                        name="ethnicity"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-sky-300
                               focus:border-sky-400">

                        <option value="" disabled
                            {% if not request.form.get('ethnicity') %}selected{% endif %}>
                            Select Ethnicity
                        </option>

                        <option value="group A"
                            {% if request.form.get('ethnicity') == 'group A' %}selected{% endif %}>
                            Group A
                        </option>

                        <option value="group B"
                            {% if request.form.get('ethnicity') == 'group B' %}selected{% endif %}>
                            Group B
                        </option>

                        <option value="group C"
                            {% if request.form.get('ethnicity') == 'group C' %}selected{% endif %}>
                            Group C
                        </option>

                        <option value="group D"
                            {% if request.form.get('ethnicity') == 'group D' %}selected{% endif %}>
                            Group D
                        </option>

                        <option value="group E"
                            {% if request.form.get('ethnicity') == 'group E' %}selected{% endif %}>
                            Group E
                        </option>

                    </select>
                </div>


                <!-- Parental Education -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">
                        Parental Level of Education
                    </label>

                    <select
                        name="parental_level_of_education"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-sky-300
                               focus:border-sky-400">

                        <option value="" disabled
                            {% if not request.form.get('parental_level_of_education') %}selected{% endif %}>
                            Select Parent Education
                        </option>

                        <option value="associate's degree"
                            {% if request.form.get('parental_level_of_education') == "associate's degree" %}selected{% endif %}>
                            Associate's Degree
                        </option>

                        <option value="bachelor's degree"
                            {% if request.form.get('parental_level_of_education') == "bachelor's degree" %}selected{% endif %}>
                            Bachelor's Degree
                        </option>

                        <option value="high school"
                            {% if request.form.get('parental_level_of_education') == 'high school' %}selected{% endif %}>
                            High School
                        </option>

                        <option value="master's degree"
                            {% if request.form.get('parental_level_of_education') == "master's degree" %}selected{% endif %}>
                            Master's Degree
                        </option>

                        <option value="some college"
                            {% if request.form.get('parental_level_of_education') == 'some college' %}selected{% endif %}>
                            Some College
                        </option>

                        <option value="some high school"
                            {% if request.form.get('parental_level_of_education') == 'some high school' %}selected{% endif %}>
                            Some High School
                        </option>

                    </select>
                </div>


                <!-- Lunch -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">
                        Lunch Type
                    </label>

                    <select
                        name="lunch"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-sky-300
                               focus:border-sky-400">

                        <option value="" disabled
                            {% if not request.form.get('lunch') %}selected{% endif %}>
                            Select Lunch Type
                        </option>

                        <option value="free/reduced"
                            {% if request.form.get('lunch') == 'free/reduced' %}selected{% endif %}>
                            Free/Reduced
                        </option>

                        <option value="standard"
                            {% if request.form.get('lunch') == 'standard' %}selected{% endif %}>
                            Standard
                        </option>

                    </select>
                </div>


                <!-- Test Preparation -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">
                        Test Preparation Course
                    </label>

                    <select
                        name="test_preparation_course"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-sky-300
                               focus:border-sky-400">

                        <option value="" disabled
                            {% if not request.form.get('test_preparation_course') %}selected{% endif %}>
                            Select Test Course
                        </option>

                        <option value="none"
                            {% if request.form.get('test_preparation_course') == 'none' %}selected{% endif %}>
                            None
                        </option>

                        <option value="completed"
                            {% if request.form.get('test_preparation_course') == 'completed' %}selected{% endif %}>
                            Completed
                        </option>

                    </select>
                </div>


                <!-- Reading Score -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">
                        Reading Score out of 100
                    </label>

                    <input
                        type="number"
                        name="reading_score"
                        value="{{ request.form.get('reading_score', '') }}"
                        placeholder="Enter your Reading Score"
                        min="0"
                        max="100"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-sky-300
                               focus:border-sky-400">
                </div>


                <!-- Writing Score -->
                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">
                        Writing Score out of 100
                    </label>

                    <input
                        type="number"
                        name="writing_score"
                        value="{{ request.form.get('writing_score', '') }}"
                        placeholder="Enter your Writing Score"
                        min="0"
                        max="100"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-sky-300
                               focus:border-sky-400">
                </div>


                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full bg-sky-400 hover:bg-sky-500
                           text-white font-semibold py-3 px-6
                           rounded-lg transition duration-200
                           shadow-sm">

                    Predict Your Maths Score

                </button>

            </form>


            <!-- Prediction Result -->
            {% if results %}

            <div class="mt-6 bg-sky-50 border border-sky-200
                        rounded-xl p-5 text-center">

                <p class="text-gray-600 font-medium">
                    Predicted Maths Score
                </p>

                <p class="text-3xl font-bold text-sky-500 mt-2">
                    {{ results }}
                </p>

            </div>

            {% endif %}


            <!-- Error -->
            {% if error %}

            <div class="mt-5 bg-red-50 border border-red-200
                        rounded-xl p-4">

                <p class="text-red-600">
                    <span class="font-semibold">Error:</span>
                    {{ error }}
                </p>

            </div>

            {% endif %}

        </div>
    </div>

</div>
```

</body>
</html>
